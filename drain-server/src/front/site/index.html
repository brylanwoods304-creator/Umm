          /* margin: the app's CSS reset zeroes it later; without it here the boot skeleton jumps 8px */
          body { background-color: #080A15; margin: 0; }
          /* Boot skeleton of the mobile home: painted with the HTML, replaced by the first React render.
             Shapes follow the real screen so nothing jumps when it swaps; no motion on purpose. */
          .boot { display: none; }
          @media (max-width: 767px) { html.boot-home .boot { display: block; } }
          .boot-header { height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #27272A; box-sizing: border-box; }

          .boot-cta { height: 44px; width: 100%; border-radius: 8px; background: #141619; }
          .boot-tabs { display: flex; gap: 20px; padding: 14px 16px 30px; }
          .boot-row { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; }
          .boot-dot { width: 28px; height: 28px; border-radius: 50%; background: #141619; flex: none; }
          .boot-grow { flex: 1; display: flex; flex-direction: column; gap: 6px; }
          .boot-badge { width: 76px; height: 28px; border-radius: 14px; background: #141619; flex: none; }
